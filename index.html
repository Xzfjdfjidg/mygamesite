<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملعب | المركز الإخباري الشامل للألعاب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }
    .logo span { color: var(--primary); }

    .search-box input {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 20px;
      color: var(--text);
      font-family: inherit;
      width: 100%;
      max-width: 300px;
    }

    main {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .loader {
      text-align: center;
      padding: 3rem;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #334155;
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .badge {
      align-self: flex-start;
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .card-snippet {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">🎮 ملعب <span>All Gaming</span></a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن سوني، إكس بوكس، ألعاب جديدة...">
    </div>
  </header>

  <main>
    <div id="loader" class="loader">⏳ جاري تغطية كافّة الألعاب، سوني، وإكس بوكس تلقائياً...</div>
    <div class="news-grid" id="newsGrid"></div>
  </main>

  <script>
    // المصادر الشاملة: IGN + PlayStation + Xbox
    const FEEDS = [
      'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.ign.com%2Frss%2Farticles%2Ffeed%3Ftags%3Dgaming',
      'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.xbox.com%2Fen-us%2Ffeed%2F',
      'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fblog.playstation.com%2Ffeed%2F'
    ];

    let allArticles = [];

    async function fetchAllNews() {
      const loader = document.getElementById('loader');

      try {
        const requests = FEEDS.map(url => fetch(url).then(res => res.json()));
        const results = await Promise.all(requests);

        results.forEach((data, index) => {
          if (data.status === 'ok') {
            const sourceName = index === 1 ? 'Xbox' : index === 2 ? 'PlayStation' : 'ألعاب عالمية';
            const items = data.items.map(item => ({ ...item, source: sourceName }));
            allArticles = allArticles.concat(items);
          }
        });

        // ترتيب المقالات من الأحدث للأقدم
        allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

        loader.style.display = 'none';
        renderNews(allArticles);
      } catch (err) {
        loader.textContent = 'تعذر جلب الأخبار، يرجى تحديث الصفحة.';
      }
    }

    function renderNews(items) {
      const grid = document.getElementById('newsGrid');
      if (items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">لا توجد أخبار مطابقة.</p>';
        return;
      }

      grid.innerHTML = items.map(item => {
        const imgUrl = item.thumbnail || (item.enclosure && item.enclosure.link) || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80';
        const cleanSnippet = item.description.replace(/<[^>]*>?/gm, '').substring(0, 110) + '...';

        return `
          <a class="card" href="${item.link}" target="_blank">
            <img src="${imgUrl}" class="card-img" alt="صورة الخبر" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80'">
            <div class="card-content">
              <span class="badge">${item.source}</span>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-snippet">${cleanSnippet}</p>
              <span class="card-date">🕒 ${new Date(item.pubDate).toLocaleDateString('ar-EG')}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase().trim();
      const filtered = allArticles.filter(a => 
        a.title.toLowerCase().includes(val) || 
        a.description.toLowerCase().includes(val) ||
        a.source.toLowerCase().includes(val)
      );
      renderNews(filtered);
    });

    fetchAllNews();
  </script>
</body>
</html>
