<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملعب | أخبار الألعاب والشطرنج</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo span { color: var(--primary); }

    .search-box input {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      color: var(--text);
      font-family: inherit;
      width: 200px;
      transition: all 0.3s;
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      width: 250px;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      border-right: 4px solid var(--primary);
      padding-right: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      border-color: var(--primary);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .badge {
      align-self: flex-start;
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    .badge.chess {
      background: rgba(34, 197, 94, 0.2);
      color: var(--accent);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .card-snippet {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Modal / Reader View */
    .reader-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 1000;
      display: none;
      overflow-y: auto;
      padding: 2rem 1rem;
    }
    .reader-content {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 1rem; left: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .reader-img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 12px;
      margin: 1.5rem 0;
    }
    .reader-body {
      font-size: 1.1rem;
      color: #cbd5e1;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">🎮 ملعب <span>News</span></a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="بحث عن خبر...">
    </div>
  </header>

  <main>
    <div class="section-title">
      <h2>آخر الأخبار العالمية والحصرية</h2>
    </div>

    <div class="news-grid" id="newsGrid">
      <!-- Cards will be inserted by JS -->
    </div>
  </main>

  <!-- Article View Modal -->
  <div class="reader-modal" id="readerModal">
    <div class="reader-content">
      <button class="close-btn" id="closeBtn">✕</button>
      <span class="badge" id="modalBadge">تصنيف</span>
      <h1 id="modalTitle" style="margin-top:0.5rem;">عنوان الخبر</h1>
      <p class="card-date" id="modalDate">التاريخ</p>
      <img id="modalImg" class="reader-img" src="" alt="">
      <div class="reader-body" id="modalBody">محتوى الخبر...</div>
    </div>
  </div>

  <script>
    const newsData = [
      {
        id: 1,
        title: "الشاب الهندي غوكيش يتوج ببطولة العالم للشطرنج كأصغر بطل في التاريخ",
        category: "شطرنج",
        isChess: true,
        date: "أكتوبر 2026",
        img: "https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&w=800&q=80",
        snippet: "دخل اللاعب الهندي دوماراجو غوكيش التاريخ بعد انتزاعه لقب بطولة العالم للشطرنج في مواجهة تاريخية حابسة الأنفاس.",
        body: "شهدت بطولة العالم للشطرنج لحظة تاريخية استثنائية بعد أن تمكن الجراند ماستر الهندي دوماراجو غوكيش (Gukesh D) من حسم اللقب العالمي لصالحه، متفوقاً على منافسيه في جولات دراماتيكية.\n\nوبهذا الفوز، أصبح غوكيش أصغر بطل عالم في تاريخ اللعبة، مكسراً الرقم القياسي السابق الذي كان يحمله الأسطورة غاري كاسباروف. وأشاد أساطير اللعبة بمستوى التركيز الذهني والنقلات التكتيكية التي قدمها غوكيش طوال المواجهات الحاسمة."
      },
      {
        id: 2,
        title: "فريق T1 الكوري يتوج بلقب بطولة العالم لـ League of Legends بقيادة الاسطورة Faker",
        category: "رياضة إلكترونية",
        isChess: false,
        date: "سبتمبر 2026",
        img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80",
        snippet: "واصل أسطورة الألعاب الإلكترونية Faker كتابة التاريخ بعد قيادة فريقه T1 للتتويج بلقب Worlds في صالة ممتلئة بالجماهير.",
        body: "في ليلة خيالية لعشاق الرياضات الإلكترونية، توج فريق T1 الكوري بلقب بطولة العالم لـ League of Legends (Worlds) وسط حماس جماهيري غفير.\n\nوكان قائد الفريق Lee 'Faker' Sang-hyeok النجم الأبرز في السلسلة النهائية، حيث أظهر أداءً تكتيكياً خارقاً أثبت من خلاله استمراره كأفضل لاعب في تاريخ اللعبة على الإطلاق، رغم المنافسة الشرسة من الفرق الصينية والأوروبية."
      },
      {
        id: 3,
        title: "رسمياً: الإعلان عن إطلاق لعبة GTA VI في الخريف القادم مع عرض تفاعلي جديد",
        category: "أخبار الشركات",
        isChess: false,
        date: "أغسطس 2026",
        img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80",
        snippet: "كشفت شركة Rockstar Games عن تفاصيل جديدة تخص عالم لعبة Grand Theft Auto VI وموعد صدورها النهائي.",
        body: "أطلقت شركة Rockstar Games الإعلان الترويجي الثاني للعبة المنتظرة Grand Theft Auto VI، مؤكدة أن موعد الطرح الرسمي سيكون في خريف هذا العام على منصات PlayStation 5 و Xbox Series X/S.\n\nواستعرض العرض التفاصيل الرسومية المذهلة لمدينة Vice City المحسنة، مع نظام تفاعل هو الذكي من نوعه في تاريخ ألعاب العالم المفتوح."
      },
      {
        id: 4,
        title: "ماغنوس كارلسن يفوز ببطولة السريع والشطرنج الخاطف ويهاجم نظام البطولات التقليدية",
        category: "شطرنج",
        isChess: true,
        date: "أغسطس 2026",
        img: "https://images.unsplash.com/photo-1586165368502-1bad197a6461?auto=format&fit=crop&w=800&q=80",
        snippet: "أثبت المصنف الأول عالمياً ماغنوس كارلسن هيمنته المطلقة على بطولات الشطرنج السريع، مؤكداً فضله لهذا النمط السريع.",
        body: "توّج النرويجي ماغنوس كارلسن بلقب بطولة الشطرنج الخاطف والسريع بعد أدوار هجومية ساحقة لم يمنح فيها منافسيه أي فرصة للتنفس.\n\nوفي تصريح مثير بعد التتويج، كرر كارلسن انتقاده لنظام الشطرنج الكلاسيكي الطويل، مشيراً إلى أن مستقبل اللعبة يكمن في المباريات السريعة والمثيرة التي تجذب الأجيال الجديدة وتزيد من الحماس."
      }
    ];

    const grid = document.getElementById('newsGrid');
    const modal = document.getElementById('readerModal');
    const searchInput = document.getElementById('searchInput');

    function renderNews(items) {
      grid.innerHTML = items.map(item => `
        <div class="card" onclick="openArticle(${item.id})">
          <img src="${item.img}" alt="${item.title}" class="card-img">
          <div class="card-content">
            <span class="badge ${item.isChess ? 'chess' : ''}">${item.category}</span>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-snippet">${item.snippet}</p>
            <span class="card-date">🕒 ${item.date}</span>
          </div>
        </div>
      `).join('');
    }

    function openArticle(id) {
      const item = newsData.find(n => n.id === id);
      if(!item) return;
      document.getElementById('modalBadge').textContent = item.category;
      document.getElementById('modalBadge').className = `badge ${item.isChess ? 'chess' : ''}`;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalDate').textContent = '🕒 ' + item.date;
      document.getElementById('modalImg').src = item.img;
      document.getElementById('modalBody').innerText = item.body;
      modal.style.display = 'block';
    }

    document.getElementById('closeBtn').onclick = () => modal.style.display = 'none';

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      const filtered = newsData.filter(n => n.title.toLowerCase().includes(val) || n.snippet.toLowerCase().includes(val));
      renderNews(filtered);
    });

    // Initial Render
    renderNews(newsData);
  </script>
</body>
</html>
